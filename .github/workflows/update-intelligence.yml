name: Update TerraPulse historical intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '18 5 * * *'
  push:
    paths:
      - 'scripts/build_intelligence.py'
      - 'requirements.txt'
      - '.github/workflows/update-intelligence.yml'
permissions:
  contents: write
jobs:
  analyze-usgs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: pip install -r requirements.txt
      - name: Test preprocessing and statistical analysis
        run: python -m unittest discover -s tests -v
      - name: Build real-data analysis
        run: python scripts/build_intelligence.py
      - name: Publish real USGS insights safely to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Contributors may push while the workflow is running.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --mixed origin/main
            git add data/insights.json data/earthquakes_historical.csv
            if git diff --cached --quiet; then
              echo "Already up to date"
              exit 0
            fi
            git commit -m "Update USGS earthquake historical insights"
            if git push origin HEAD:main; then
              echo "Data published"
              exit 0
            fi
            echo "Remote changed during publishing (attempt $attempt); retrying"
            sleep 3
          done
          echo "Could not publish USGS results after retries" >&2
          exit 1
