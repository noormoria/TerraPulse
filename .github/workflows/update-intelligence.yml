name: Update TerraPulse historical intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '18 5 * * *'
  push:
    paths:
      - 'scripts/build_intelligence.py'
      - 'requirements.txt'
      - '.github/workflows/update-intelligence.yml'
permissions:
  contents: write
jobs:
  analyze-usgs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: pip install -r requirements.txt
      - name: Test preprocessing and statistical analysis
        run: python -m unittest discover -s tests -v
      - name: Build real-data analysis
        run: python scripts/build_intelligence.py
      - name: Commit updated insights only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Advance to the newest remote head without discarding generated data files.
          git fetch origin main
          git reset --mixed origin/main
          git add data/insights.json data/earthquakes_historical.csv
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update USGS earthquake historical insights"
            git push
          fi